name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: Frontend, API and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.23.3"
      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit and API route tests
        run: npm test
      - name: Production build
        run: npm run build

  labs-image:
    name: Build unified labs image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --pull -f labs/Dockerfile -t security-labs:ci labs
      - name: Smoke test both labs sequentially
        run: bash scripts/test-lab-image.sh security-labs:ci
